syntax = "proto3";

package application;

option go_package = "./application";

service ApplicationFactory {
    rpc Create (RequestBody) returns (ResponseBody) {}
    rpc Delete (NameHolder) returns (DeletionResponse) {}
    rpc Rebuild (NameHolder) returns (ResponseBody) {}
    rpc FetchLogs (LogRequest) returns (LogResponse) {}
    rpc Update (NameHolder) returns (ResponseBody) {}
    rpc FetchRunningContainers (NodeInventory) returns (NodeInventory) {}
    rpc RemoveContainers (NodeInventory) returns (DeletionResponse) {}
}

message RequestBody {
    string language = 1;
    string owner = 2;
    bytes data = 3;
}

message ResponseBody {
    bytes data = 1;
}

message NameHolder {
    string name = 1;
}

message DeletionResponse {
    bool success = 1;
}

message LogRequest {
    string name = 1;
    string tail = 2;
}

message LogResponse {
    bool success = 1;
    repeated string data = 2;
}

message NodeInventory {
    string instanceURL = 1;
    repeated string containerList = 2;
    bool deleteVolume = 3;
}
